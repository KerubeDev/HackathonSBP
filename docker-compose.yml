services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_template
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/002_runs.sql:/docker-entrypoint-initdb.d/002-runs.sql:ro
      - ./db/003_sbp_domain.sql:/docker-entrypoint-initdb.d/003-sbp-domain.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_template"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5433:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_template
      READONLY_DATABASE_URL: postgresql+psycopg://agent_readonly:agent_readonly@postgres:5432/agent_template
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-72b-instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen2.5:7b}
      API_KEY: ${API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      QVAC_BASE_URL: ${QVAC_BASE_URL:-http://host.docker.internal:8181}
      QVAC_MODEL: ${QVAC_MODEL:-default}
      ALLOW_DETERMINISTIC_FALLBACK: ${ALLOW_DETERMINISTIC_FALLBACK:-false}
      EXECUTION_MODE: ${EXECUTION_MODE:-sync}
      ALLOWED_CHART_TYPES: ${ALLOWED_CHART_TYPES:-table,bar,line,area,pie,scatter,radar,heatmap,funnel,gauge,treemap,boxplot,calendar}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3001:3000"]
volumes:
  pgdata: {}
